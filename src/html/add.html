<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Access-Control-Allow-Origin" content="*" />
    <title>Moment 2 - formulär</title>

    <link rel="stylesheet" href="../css/main.scss">
    <script src="../js/main.js" type="module"></script>
    
</head>
<body>

    <header>
        <nav>
            <ul class="main-menu">
                <li><a href="index.html">Startsida</a></li>
                <li id="current-page">Lägg till jobb</li>
                <li><a href="about.html">Om sidan</a></li>
            </ul>
        </nav>
    </header>

    <h1>Lägg till jobb</h1>
    <main class="main-form">
        
        <form id="form">
            <h2>Formulär</h2>
            <div>
                <label for="companyName">Företagsnamn:</label>
                <br>
                <input type="text" id="companyName" name="companyName" value="Ex. Tullverket">
            </div>

            <div>
                <label for="jobTitle">Jobbtitel:</label>
                <br>
                <input type="text" id="jobTitle" name="jobTitle" value="Ex. Administratör">
            </div>
            
            <div>
                <label for="endDate">Avslutningsdatum:</label>
                <br>
                <input type="text" id="endDate" name="endDate" value="Ex. 2022-07-31">
            </div>
            
            <div>
                <label for="description">Jobbeskrivning:</label>
                <br>
                <input type="text" id="description" name="description" value="Ex. Handläggde ärenden">
            </div>

            <input class="add-job" type="submit" value="Lägg till jobb">
        </form>

        <aside>
            <h2>Instruktioner</h2>
            <ul>
                <li>Ta bort exemplen i rutorna innan du börjar skriva in din information</li>
                <li>Fyll i alla fält</li>
                <li>Datum ska skrivas år-månad-dag</li>
            </ul>
        </aside>
    </main>

    <footer>
        <p>Amanda Thim - amth2302</p>
    </footer>
    
</body>
</html>
